site_name: Glossário de IA e Ferramentas Digitais
site_url: https://lucchesia.github.io/iaguia-coc-fiocruz/
site_description: Referência navegável de ferramentas digitais e de conceitos de inteligência artificial para a pesquisa e a educação na Casa de Oswaldo Cruz/Fiocruz
site_author: Casa de Oswaldo Cruz / Fiocruz
repo_url: https://github.com/lucchesia/iaguia-coc-fiocruz
# Sem esta linha o MkDocs deriva "edit/master/docs/" a partir do repo_url, e o branch padrão
# daqui é main. O botão de editar página não está ligado (content.action.edit está fora de
# theme.features), então nada disso aparece hoje — a declaração fecha a armadilha para depois.
edit_uri: edit/main/docs/
docs_dir: docs
copyright: © 2026 Casa de Oswaldo Cruz / Fiocruz · Conteúdo em CC BY-NC-SA 4.0

# Guardas contra artefatos do Word que por acaso caiam em docs/. As entradas que
# nomeavam os templates de verbete e as seções descontinuadas do guia saíram junto
# com os arquivos.
exclude_docs: |
  *.docx
  ~$*

# Páginas que existem no site mas não aparecem no menu do topo, cada uma alcançada por
# outro caminho — declaradas aqui para o build --strict não acusar página fora do nav.
# licenca.md: alcançada pelos links do rodapé.
# encontrar.md: alcançada pelo botão da home e pelas chamadas nos índices das duas coleções.
# tags.md: alcançada pelas etiquetas de cada verbete e pela seção "Como navegar" da home.
not_in_nav: |
  licenca.md
  encontrar.md
  tags.md

hooks:
  - scripts/generate_facets.py

extra_css:
  - stylesheets/facet-finder.css
  - stylesheets/custom.css

extra_javascript:
  - path: javascripts/facet-finder.js
    type: module

theme:
  name: material
  custom_dir: overrides
  language: pt
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    # Com .sticky as abas entram dentro do <header>, que já é fixo: navegação e
    # título do glossário ficam visíveis o tempo todo, inclusive rolando.
    - navigation.tabs.sticky
    - navigation.top
    # navigation.footer fora de propósito: o rodapé institucional (overrides/main.html)
    # já fecha a página, e a navegação anterior/próxima duplicava o menu do topo.
    - search.highlight
    - search.suggest
    - content.tooltips
  font:
    text: Fira Sans
    code: Roboto Mono

plugins:
  - search:
      lang: pt
  - tags

markdown_extensions:
  - admonition
  # O Guia traz onze notas de rodapé vindas do docx; sem esta extensão os
  # marcadores [^1] apareceriam como texto literal na página.
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - meta
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

